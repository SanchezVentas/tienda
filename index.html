<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANCHEZ VENTAS - Plataforma Oficial</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #25d366;
            --accent-hover: #1ebd58;
            --danger-color: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--card-bg);
            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .auth-box {
            max-width: 400px;
            margin: 100px auto;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .auth-box h2 {
            margin-top: 0;
            text-align: center;
            color: var(--accent-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .auth-toggle {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #94a3b8;
            cursor: pointer;
        }

        .user-info {
            background-color: var(--card-bg);
            padding: 15px 25px;
            border-radius: 8px;
            text-align: right;
        }

        .user-info span {
            display: block;
            font-size: 14px;
        }

        .user-info .saldo-val {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-color);
        }

        .btn-logout {
            background-color: var(--danger-color);
            color: white;
            padding: 5px 10px;
            font-size: 12px;
            width: auto;
            margin-top: 5px;
        }

        .grid-productos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card h3 {
            margin: 0 0 10px 0;
            font-size: 18px;
        }

        .precio {
            font-size: 22px;
            font-weight: bold;
            color: var(--accent-color);
            margin: 10px 0;
        }

        .stock {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 15px;
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // =================================================================
        // CONFIGURA TU LLAVE SECRETA AQUÍ ABAJO:
        // Copia y pega aquí exactamente el objeto 'firebaseConfig' de tu foto
        // =================================================================
        const firebaseConfig = {
    apiKey: "AIzaSyAZuKg_9i01rNsoEnt8-oQ1XkkG0yCsfDE",
    authDomain: "sanchez-ventas.firebaseapp.com",
    projectId: "sanchez-ventas",
    storageBucket: "sanchez-ventas.firebasestorage.app",
    messagingSenderId: "740056330272",
    appId: "1:740056330272:web:568fa9a7efdd29c03d0c40"
};

        // Tu número de WhatsApp real para recibir las notificaciones de compra
        const TU_WHATSAPP = "526321051982"; 

        // Inicializamos Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Lista de tus 31 servicios de streaming oficiales
        const listaProductos = [
            { id: 1, nombre: "Netflix Perfil Privado", precio: 40, stock: 10 },
            { id: 2, nombre: "Netflix Combo 2 Pantallas", precio: 75, stock: 5 },
            { id: 3, nombre: "Netflix Cuenta Completa Premium", precio: 170, stock: 3 },
            { id: 4, nombre: "Disney+ Estándar Perfil", precio: 35, stock: 12 },
            { id: 5, nombre: "Disney+ Premium Perfil", precio: 50, stock: 8 },
            { id: 6, nombre: "Disney+ Cuenta Completa", precio: 150, stock: 4 },
            { id: 7, nombre: "Max (HBO) Estándar Perfil", precio: 30, stock: 15 },
            { id: 8, nombre: "Max (HBO) Premium Perfil", precio: 45, stock: 9 },
            { id: 9, nombre: "Max Cuenta Completa Premium", text: "Mes completo", precio: 130, stock: 5 },
            { id: 10, nombre: "Prime Video Perfil Privado", precio: 25, stock: 20 },
            { id: 11, nombre: "Prime Video Cuenta Completa", precio: 90, stock: 6 },
            { id: 12, nombre: "Paramount+ Perfil Privado", precio: 25, stock: 10 },
            { id: 13, nombre: "Paramount+ Cuenta Completa", precio: 80, stock: 4 },
            { id: 14, nombre: "Crunchyroll Mega Fan Perfil", precio: 20, stock: 25 },
            { id: 15, nombre: "Crunchyroll Cuenta Completa", precio: 70, stock: 8 },
            { id: 16, nombre: "Vix Premium Perfil Privado", precio: 30, stock: 14 },
            { id: 17, nombre: "Vix Premium Cuenta Completa", precio: 110, stock: 5 },
            { id: 18, nombre: "Apple TV+ Perfil Privado", precio: 30, stock: 10 },
            { id: 19, nombre: "Apple TV+ Cuenta Completa", precio: 100, stock: 3 },
            { id: 20, nombre: "Spotify Premium 1 Mes Renovables", precio: 35, stock: 30 },
            { id: 21, nombre: "Spotify Premium 3 Meses", precio: 85, stock: 15 },
            { id: 22, nombre: "YouTube Premium 1 Mes Cuenta Nueva", precio: 25, stock: 40 },
            { id: 23, nombre: "YouTube Premium 4 Meses Correo Inv.", precio: 70, stock: 20 },
            { id: 24, nombre: "Amazon Music Unlimited 1 Mes", precio: 25, stock: 15 },
            { id: 25, nombre: "Deezer Premium 1 Mes", precio: 25, stock: 10 },
            { id: 26, nombre: "Plex Pass Mensual Perfil", precio: 35, stock: 8 },
            { id: 27, nombre: "IPTV Estándar 1 Demo / Mes", precio: 60, stock: 12 },
            { id: 28, nombre: "IPTV Premium 3 Dispositivos", precio: 140, stock: 7 },
            { id: 29, nombre: "Combo Total (Netflix+Disney+Max)", precio: 110, stock: 5 },
            { id: 30, nombre: "Combo Música (Spotify+YouTube) 1M", precio: 50, stock: 10 },
            { id: 31, nombre: "Canva Pro Garantía 1 Año", precio: 50, stock: 50 }
        ];

        let usuarioLogueado = null;
        let saldoActual = 0;

        // Elementos de la interfaz
        const authSection = document.getElementById('auth-section');
        const tiendaSection = document.getElementById('tienda-section');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const authTitle = document.getElementById('auth-title');
        const btnAuth = document.getElementById('btn-auth');
        const authToggle = document.getElementById('auth-toggle');
        const userEmailDisplay = document.getElementById('user-email');
        const userSaldoDisplay = document.getElementById('user-saldo');

        let modoRegistro = false;

        // Cambiar entre iniciar sesión y registrarse
        authToggle.addEventListener('click', () => {
            modoRegistro = !modoRegistro;
            if (modoRegistro) {
                authTitle.innerText = "Registrar Cliente Nuevo";
                btnAuth.innerText = "Crear Cuenta";
                authToggle.innerText = "¿Ya tienes cuenta? Inicia Sesión";
            } else {
                authTitle.innerText = "Ingreso Clientes";
                btnAuth.innerText = "Iniciar Sesión";
                authToggle.innerText = "¿Eres cliente nuevo? Regístrate aquí";
            }
        });

        // Manejar el botón de Auth
        btnAuth.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if(!email || !password) {
                alert("Por favor, llena todos los campos.");
                return;
            }

            try {
                if (modoRegistro) {
                    // Crea usuario en la nube de Firebase de forma encriptada
                    const cred = await createUserWithEmailAndPassword(auth, email, password);
                    // Le asigna saldo inicial de $0.00 en la base de datos Firestore de manera protegida
                    await setDoc(doc(db, "usuarios", cred.user.uid), {
                        correo: email,
                        saldo: 0
                    });
                    alert("¡Cuenta creada con éxito! Bienvenido.");
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                alert("Error de autenticación: " + error.message);
            }
        });

        // Botón cerrar sesión
        document.getElementById('btn-logout').addEventListener('click', () => {
            signOut(auth);
        });

        // Listener de estado de autenticación (Monitorea si hay alguien conectado)
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                usuarioLogueado = user;
                authSection.style.display = 'none';
                tiendaSection.style.display = 'block';
                userEmailDisplay.innerText = user.email;
                
                // Traer el saldo protegido desde los servidores de Google Firebase
                const userDoc = await getDoc(doc(db, "usuarios", user.uid));
                if (userDoc.exists()) {
                    saldoActual = userDoc.data().saldo;
                    userSaldoDisplay.innerText = saldoActual;
                }
                generarTienda();
            } else {
                usuarioLogueado = null;
                authSection.style.display = 'block';
                tiendaSection.style.display = 'none';
            }
        });

        // Renderizar las tarjetas en la pantalla
        function generarTienda() {
            const grid = document.getElementById('grid-productos');
            grid.innerHTML = '';

            listaProductos.forEach(prod => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>${prod.nombre}</h3>
                    <div class="precio">$${prod.precio} cr.</div>
                    <div class="stock">Disponibles: ${prod.stock}</div>
                    <button id="btn-prod-${prod.id}">${prod.stock > 0 ? 'Solicitar Servicio' : 'Agotado'}</button>
                `;
                grid.appendChild(card);

                const btn = card.querySelector(`#btn-prod-${prod.id}`);
                if (prod.stock <= 0) {
                    btn.style.backgroundColor = '#475569';
                    btn.disabled = true;
                } else {
                    btn.addEventListener('click', () => comprar(prod));
                }
            });
        }

        // Función de compra Blindada y Conectada a WhatsApp
        async function comprar(prod) {
            if (!usuarioLogueado) return;

            // 1. Validar saldo directo desde el servidor de Google (No de la pantalla)
            const userDocRef = doc(db, "usuarios", usuarioLogueado.uid);
            const userDoc = await getDoc(userDocRef);
            
            if (userDoc.exists()) {
                const saldoReal = userDoc.data().saldo;

                if (saldoReal >= prod.precio) {
                    const nuevoSaldo = saldoReal - prod.precio;
                    
                    // 2. Descontar dinero directamente en el servidor de Google
                    await updateDoc(userDocRef, {
                        saldo: nuevoSaldo
                    });

                    // Actualiza visualmente
                    saldoActual = nuevoSaldo;
                    userSaldoDisplay.innerText = saldoActual;
                    prod.stock -= 1;
                    generarTienda();

                    // 3. Lanzar redirección automática al WhatsApp de Sánchez Ventas
                    const textoMensaje = "¡Hola Sánchez Ventas! 👋%0A%0A" +
                                         "Acabo de solicitar un servicio desde la plataforma protegida.%0A%0A" +
                                         "👤 *Cliente:* " + usuarioLogueado.email + "%0A" +
                                         "📺 *Servicio:* " + prod.nombre + "%0A" +
                                         "💰 *Costo:* $" + prod.precio + ".00 créditos.%0A" +
                                         "📉 *Mi Saldo Restante:* $" + nuevoSaldo + ".00 créditos.%0A%0A" +
                                         "Quedo a la espera de mis accesos. ¡Muchas gracias!";
                    
                    const urlWhatsapp = "https://wa.me/" + TU_WHATSAPP + "?text=" + textoMensaje;
                    window.open(urlWhatsapp, '_blank');

                } else {
                    alert("Saldo Insuficiente.\nNecesitas $" + prod.precio + " créditos para adquirir este servicio. Comunícate con Sánchez Ventas para recargar.");
                }
            }
        }
    </script>
</head>
<body>

    <div class="container">
        <div id="auth-section" class="auth-box">
            <h2 id="auth-title">Ingreso Clientes</h2>
            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com">
            </div>
            <div class="form-group">
                <label for="password">Contraseña Secreta:</label>
                <input type="password" id="password" placeholder="******">
            </div>
            <button id="btn-auth">Iniciar Sesión</button>
            <div id="auth-toggle" class="auth-toggle">¿Eres cliente nuevo? Regístrate aquí</div>
        </div>

        <div id="tienda-section" style="display: none;">
            <header>
                <div>
                    <h1>Sánchez Ventas</h1>
                </div>
                <div class="user-info">
                    <span>Usuario: <strong id="user-email">...</strong></span>
                    <span>Tu Saldo: <span class="saldo-val">$<span id="user-saldo">0</span></span> cr.</span>
                    <button id="btn-logout" class="btn-logout">Cerrar Sesión</button>
                </div>
            </header>

            <div id="grid-productos" class="grid-productos">
                </div>
        </div>
    </div>

</body>
</html>
